{# include with name label errors autocomplete meter #}
<div x-data="{ show: false, v: '' }">
  <div class="flex items-baseline justify-between">
    <label for="f-{{ name }}" class="field-label">{{ label }}</label>
    {% if forgot %}<a href="{% url 'web:password_reset' %}" class="text-[12px] text-faint hover:text-gold">Забыли пароль?</a>{% endif %}
  </div>
  <div class="relative">
    <input id="f-{{ name }}" name="{{ name }}" :type="show ? 'text' : 'password'" type="password" required x-model="v"
           autocomplete="{{ autocomplete|default:'current-password' }}" class="input pr-14"
           {% if errors %}aria-invalid="true"{% endif %}>
    <button type="button" @click="show = !show" class="absolute inset-y-0 right-0 grid w-12 place-items-center text-faint hover:text-gold" :aria-label="show ? 'Скрыть пароль' : 'Показать пароль'">
      <svg x-show="!show" class="size-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
      <svg x-show="show" x-cloak class="size-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3l18 18M10.6 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/></svg>
    </button>
  </div>
  {% if meter %}
  <div class="mt-3 grid grid-cols-4 gap-1.5" aria-hidden="true"
       x-data="{ get score() { let s = 0; const v = this.v; if (v.length >= 8) s++; if (/[A-ZА-Я]/.test(v) && /[a-zа-я]/.test(v)) s++; if (/\d/.test(v)) s++; if (/[^\w\s]/.test(v) || v.length >= 14) s++; return v ? Math.max(1, s) : 0 } }">
    <template x-for="i in 4"><span class="h-0.5 rounded-full transition-colors duration-300" :class="i <= score ? (score >= 3 ? 'bg-patina' : score === 2 ? 'bg-gold' : 'bg-vermilion') : 'bg-graphite-2'"></span></template>
  </div>
  {% endif %}
  {% if errors %}<p class="field-error">{{ errors|join:" " }}</p>{% endif %}
</div>
