<div x-cloak x-show="cartOpen" class="fixed inset-0 z-[60]" role="dialog" aria-modal="true" aria-label="Корзина"
     @keydown.escape.window="cartOpen = false" x-trap="cartOpen">
  <div x-show="cartOpen" x-transition.opacity.duration.300ms class="absolute inset-0 bg-lacquer-deep/80" @click="cartOpen = false"></div>
  <aside x-show="cartOpen"
         x-transition:enter="transition duration-500 ease-ks" x-transition:enter-start="translate-x-full"
         x-transition:leave="transition duration-300 ease-ks" x-transition:leave-end="translate-x-full"
         class="absolute inset-y-0 right-0 flex w-full max-w-[440px] flex-col border-l border-rule bg-raised">
    <div class="flex h-[72px] items-center justify-between border-b border-rule px-6">
      <p class="mono-label">Корзина</p>
      <button type="button" @click="cartOpen = false" class="grid size-11 place-items-center text-champagne hover:text-gold" aria-label="Закрыть корзину">
        <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div id="cart-drawer" class="flex min-h-0 flex-1 flex-col"
         hx-get="{% url 'web:cart_drawer' %}" hx-trigger="drawer-open from:window, cart-changed from:body" hx-swap="innerHTML">
      <div class="space-y-4 p-6">
        {% for _ in "123" %}<div class="flex gap-4"><div class="size-20 animate-pulse rounded-xs bg-graphite"></div><div class="flex-1 space-y-2 pt-2"><div class="h-3 w-2/3 animate-pulse bg-graphite"></div><div class="h-3 w-1/3 animate-pulse bg-graphite"></div></div></div>{% endfor %}
      </div>
    </div>
  </aside>
</div>
