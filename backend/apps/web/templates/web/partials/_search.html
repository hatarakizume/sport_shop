<div x-cloak x-show="searchOpen" class="fixed inset-0 z-[70] flex items-start justify-center px-4 pt-[12vh]"
     role="dialog" aria-modal="true" aria-label="Поиск" @keydown.escape.window="searchOpen = false" x-trap.noscroll="searchOpen">
  <div x-show="searchOpen" x-transition.opacity class="absolute inset-0 bg-lacquer-deep/85" @click="searchOpen = false"></div>
  <div x-show="searchOpen" x-transition:enter="transition duration-300 ease-ks" x-transition:enter-start="opacity-0 -translate-y-3 scale-[.98]"
       class="relative w-full max-w-2xl overflow-hidden rounded-sm border border-rule-gold bg-raised shadow-setback">
    <form action="{% url 'web:catalog' %}" method="get" class="flex items-center gap-3 border-b border-rule px-5">
      <svg class="size-5 shrink-0 text-gold" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
      <input id="palette-input" name="q" type="search" autocomplete="off" placeholder="Кроссовки, бренд, категория…"
             class="h-16 w-full bg-transparent text-[18px] text-champagne placeholder:text-mute-deep focus:outline-none focus-visible:outline-none"
             hx-get="{% url 'web:search_suggest' %}" hx-trigger="input changed delay:180ms, search" hx-target="#palette-results">
      <kbd class="rounded-xs border border-rule px-1.5 py-0.5 font-mono text-[10px] text-mute-deep">Esc</kbd>
    </form>
    <div id="palette-results" class="max-h-[50vh] overflow-y-auto">
      {% include "web/partials/search_results.html" with q="" %}
    </div>
  </div>
</div>
